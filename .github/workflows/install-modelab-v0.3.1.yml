name: Install PEMFC ModelLab v0.3.1 from ZIP

on:
  push:
    branches: [main]
    paths:
      - 'PEMFC_ModelLab_v0.3.1.zip'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: modelab-release-v031
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Validate and extract v0.3.1
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          source = Path("PEMFC_ModelLab_v0.3.1.zip")
          if not source.is_file():
              raise ValueError("Release ZIP not found in repository root")
          target = Path("/tmp/modelab-release-v031")
          target.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(source) as archive:
              if archive.testzip() is not None:
                  raise ValueError("Corrupted ZIP entry")
              total_uncompressed = 0
              for entry in archive.infolist():
                  path = Path(entry.filename)
                  mode = (entry.external_attr >> 16) & 0o170000
                  if path.is_absolute() or ".." in path.parts or mode == 0o120000:
                      raise ValueError(f"Unsafe ZIP entry: {entry.filename}")
                  if not path.parts or path.parts[0] != "PEMFC-ModelLab":
                      raise ValueError(f"Unexpected archive path: {entry.filename}")
                  if any(part in {".git", ".github"} for part in path.parts):
                      raise ValueError(f"Protected archive path: {entry.filename}")
                  total_uncompressed += entry.file_size
                  if total_uncompressed > 250 * 1024 * 1024:
                      raise ValueError("Uncompressed archive exceeds 250 MB")
              archive.extractall(target)
          root = target / "PEMFC-ModelLab"
          required = ["app.py", "requirements.txt", "pemfc_core", "identification", "ui", "tests", "ui/home_view.py", "ui/motor2_view.py", "ui/device_admin.py"]
          missing = [name for name in required if not (root / name).exists()]
          if missing:
              raise ValueError(f"Missing expected v0.3.1 entries: {missing}")
          print("Validated PEMFC ModelLab v0.3.1")
          PY

      - name: Install validated v0.3.1 into main
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf -- {} +
          cp -a /tmp/modelab-release-v031/PEMFC-ModelLab/. .
          rm -f .github/workflows/install-modelab-v0.2.0.yml
          rm -f .github/workflows/install-modelab-v0.3.0.yml
          test -f app.py
          test -f requirements.txt
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "feat: release PEMFC ModelLab v0.3.1"
          git push origin HEAD:main
