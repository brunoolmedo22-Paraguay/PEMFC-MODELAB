name: Install PEMFC ModelLab v0.2.0 from ZIP

on:
  push:
    branches: [main]
    paths:
      - 'PEMFC_MODELAB_v0.2.0_LISTO_GITHUB.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Validate and extract release
        shell: bash
        run: |
          set -euo pipefail
          ZIP="PEMFC_MODELAB_v0.2.0_LISTO_GITHUB.zip"
          test -f "$ZIP" || { echo "::error::ZIP not found at repository root"; exit 1; }
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          zpath = Path("PEMFC_MODELAB_v0.2.0_LISTO_GITHUB.zip")
          target = Path("/tmp/modelab-release")
          target.mkdir(exist_ok=True)
          with zipfile.ZipFile(zpath) as z:
              bad = z.testzip()
              if bad: raise ValueError(f"Corrupt entry: {bad}")
              for entry in z.infolist():
                  p = Path(entry.filename)
                  if p.is_absolute() or ".." in p.parts or (entry.external_attr >> 16) & 0o170000 == 0o120000:
                      raise ValueError(f"Unsafe ZIP entry: {entry.filename}")
                  if p.parts and p.parts[0] in {".git", ".github"}:
                      raise ValueError(f"Protected path in ZIP: {entry.filename}")
              z.extractall(target)
          required = ["app.py", "requirements.txt", "pemfc_core", "identification", "ui", "tests"]
          missing = [x for x in required if not (target / x).exists()]
          if missing: raise ValueError(f"Missing expected release files: {missing}")
          print("Release validated:", len(list(target.rglob("*"))), "entries")
          PY
      - name: Install validated release
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf -- {} +
          cp -a /tmp/modelab-release/. .
          test -f app.py
          test -f requirements.txt
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "feat: release PEMFC ModelLab v0.2.0 — interactive curve digitizer"
          git push origin HEAD:main
