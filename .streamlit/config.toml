[server]
maxUploadSize = 10

[browser]
gatherUsageStats = false

# Identidad visual PEMFC ModelLab v0.3.0 (sin fuentes ni recursos remotos).
[theme]
font = "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
headingFont = "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
codeFont = "ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace"
headingFontWeights = [700, 650, 600]
baseRadius = "0.55rem"
buttonRadius = "0.5rem"
showWidgetBorder = true

[theme.light]
primaryColor = "#0E7C86"
backgroundColor = "#F5F7FA"
secondaryBackgroundColor = "#E9EEF3"
textColor = "#132030"
borderColor = "#D3DBE4"
linkColor = "#0B6C75"
dataframeHeaderBackgroundColor = "#E3E9EF"
chartCategoricalColors = ["#0E7C86", "#2F6FED", "#E0891E", "#7A4FD1", "#D1495B", "#3C9D5D", "#5B6B7C"]

[theme.dark]
primaryColor = "#2EC4B6"
backgroundColor = "#0C131B"
secondaryBackgroundColor = "#152230"
textColor = "#E2E9F1"
borderColor = "#253749"
linkColor = "#5ED6CB"
dataframeHeaderBackgroundColor = "#182736"
chartCategoricalColors = ["#2EC4B6", "#6E9BFF", "#F2A541", "#A98BFF", "#FF6B81", "#5FD08A", "#93A4B5"]
